# Enable auto-merge for Dependabot PRs against 'development'. This does NOT
# merge immediately — 'gh pr merge --auto' just flags the PR to merge itself
# the moment all REQUIRED checks pass (see the 'PR Validation' workflow and
# the branch protection rule on 'development' that makes it required).
# No gating on update-type here: the required checks are the gate.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'jelliuk/docker-cups' &&
      github.event.pull_request.base.ref == 'development'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Optional safety valve: uncomment to still exclude major-version bumps
      # from auto-merge (they often carry breaking changes worth a human look)
      # while everything else merges purely on checks passing.
      # if: steps.metadata.outputs.update-type != 'version-update:semver-major'

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
