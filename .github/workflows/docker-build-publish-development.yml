name: Development Build and Publish

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC — regular validation of the pipeline
  push:
    branches: [development]  # Immediate feedback on merges (incl. Dependabot auto-merges)
  workflow_dispatch:

concurrency:
  group: docker-cups-build-publish   # shared with Production — never run git-writing steps concurrently
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-build-scan-publish.yml
    with:
      ref: development
      tag_channel: dev
    permissions:
      contents: read   # Reduced from write — sync now authenticates as the GitHub App
      packages: write
      id-token: write
      security-events: write
