name: Development Build and Publish

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC — this is now the ONLY thing that
                          # publishes/scans/signs. Consolidates however many Dependabot
                          # merges landed that day into a single released image, instead
                          # of one full publish per merge. Immediate post-merge feedback
                          # (build-only, no publish) now lives in validate-development.yml.
  workflow_dispatch:  # Manual escape hatch to publish dev on demand, outside the daily cron

concurrency:
  group: docker-cups-build-publish   # shared with Production — never run git-writing steps concurrently
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-build-scan-publish.yml
    with:
      ref: development
      tag_channel: dev
    secrets: inherit  # Required — secrets are NOT passed to a called workflow by default,
                       # even for a same-repo ./... call. Without this, APP_ID/APP_PRIVATE_KEY
                       # (and GITHUB_TOKEN-derived secrets) are invisible inside the reusable workflow.
    permissions:
      contents: read   # Reduced from write — sync now authenticates as the GitHub App
      packages: write
      id-token: write
      security-events: write
