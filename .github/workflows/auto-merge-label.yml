name: Merge branch with label - "auto-merge"
on:
  workflow_dispatch:
  pull_request:
    # Watch PRs targeting BOTH branches so that:
    # - github-actions-update PRs (targeting development) are auto-merged
    # - development -> master PRs tagged auto-merge are also auto-merged
    branches:
      - "master"
      - "development"
    types: [labeled]
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      -  name: Checkout repository
         uses: actions/checkout@v6.0.3
         id: auto-merge
      -  name: auto-merge
         uses: "pascalgn/automerge-action@v0.16.4"
         env:
           GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
           MERGE_LABELS: "auto-merge"
