name: Docker-Dev

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "development" ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - LICENSE.md
      - .gitignore
      - .github/**
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Produces two tags on every development push:
          #   ghcr.io/jelliuk/alpine-docker-cups:development  (stable, overwritten each push)
          #   ghcr.io/jelliuk/alpine-docker-cups:dev-a1b2c3f  (immutable per commit)
          tags: |
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=sha,prefix=dev-,format=short

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}