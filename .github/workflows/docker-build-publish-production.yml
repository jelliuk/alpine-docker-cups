name: Production Build and Publish

on:
  workflow_run:
    workflows: ["Development Build and Publish"]
    types: [completed]
  workflow_dispatch:  # Manual escape hatch — e.g. re-publishing prod without waiting on dev

concurrency:
  group: docker-cups-build-publish   # shared with Development — never run git-writing steps concurrently
  cancel-in-progress: false

jobs:
  build:
    # Only run when triggered manually, or when Development succeeded.
    #
    # NOTE: we deliberately do NOT check `head_branch == 'development'` here.
    # docker-build-publish-development.yml's only triggers are now `schedule`
    # and `workflow_dispatch` (the `push` trigger was removed) — and GitHub
    # always runs `schedule`-triggered workflows against the repo's DEFAULT
    # branch (master, here), regardless of the `ref: development` passed into
    # the reusable workflow's checkout. That means a schedule-triggered dev
    # run reports head_branch: master, not development — a head_branch check
    # here would silently stop matching and production would never fire.
    # Since the dev workflow can now only be triggered deliberately (cron or
    # manual dispatch), any successful completion of it is a valid reason to
    # cascade into production; no branch-name filter is needed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/reusable-build-scan-publish.yml
    with:
      ref: master
      tag_channel: latest
    secrets: inherit  # Required — see note in docker-build-publish-development.yml
    permissions:
      contents: read   # Reduced from write — sync now authenticates as the GitHub App
      packages: write
      id-token: write
      security-events: write
