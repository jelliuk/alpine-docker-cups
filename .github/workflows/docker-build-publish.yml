name: Docker Build and Publish
on:
  # --- Scheduled Builds (Environment Specific) ---
  schedule:
    # Weekly Development Build: Runs every Monday at midnight UTC
    - cron: '0 0 * * 1' # Monday is day 1
  workflow_dispatch:
    inputs:
      triggerType:
        description: 'Trigger Type'
        required: true
        type: choice
        options: ['Ad-Hoc Test', 'Scheduled']

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    env:
      # Define the image name used for all tags (MUST BE REPLACED)
      IMAGE_NAME: ${{ github.repository }} 
      
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # --- Tag Calculation Logic & Environment Constraint Check ---
      - name: Determine Branch, Build Number, and Tags
        id: tag_calc
        run: |
          set -e 
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          BUILD_NUM="${{ github.run_number }}"

          # Calculate the date/version tag
          DATE=$(date -u +%Y-%m-%d)
          VERSION_TAG="${DATE}-v${BUILD_NUM}"
          
          # Initialize array of tags
          TAGS="${SHA} ${VERSION_TAG}"
      
          # Conditional Tagging Logic (Checks for 'main' OR 'master')
          if [ "${BRANCH}" = "main" ] || [ "${BRANCH}" = "master" ]; then
            TAGS="${TAGS} latest"
            echo "Added 'latest' tag for ${BRANCH} branch."
          fi
      
          if [ "${BRANCH}" = "development" ]; then
            TAGS="${TAGS} dev"
            echo "Added 'dev' tag for development branch."
          fi
          
          # Output the final space-separated list of tags
          echo "calculated_tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # --- Docker Build Step (Login is a prerequisite) ---
      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Images
        id: build
        run: |
          # Retrieve the calculated tags list using the correct output key
          TAGS=${{ steps.tag_calc.outputs.calculated_tags }}
          
          IFS=' ' read -r -a TAG_ARRAY <<< "$TAGS"

          IMAGE_FULL=ghcr.io/${{ env.IMAGE_NAME }}
          echo "Starting build process using the following tags:"
          
          # Using a standard C-style for loop with robust quoting
          for tag in "${TAG_ARRAY[@]}"; do
            echo "  -> Building tag: $tag"
            docker build -t "$IMAGE_FULL:$tag" .
          done

      # --- Docker Publish Step ---
      - name: Publish Docker Images to GHCR
        run: |
          # Retrieve the calculated tags list using the correct output key
          TAGS=${{ steps.tag_calc.outputs.calculated_tags }}
          
          IFS=' ' read -r -a TAG_ARRAY <<< "$TAGS"

          echo "Starting publish process..."
          
          # Using a standard C-style for loop with robust quoting
          for tag in "${TAG_ARRAY[@]}"; do
            echo "  -> Pushing tag: $tag"
            docker push ghcr.io/${{ env.IMAGE_NAME }}:$tag
          done
