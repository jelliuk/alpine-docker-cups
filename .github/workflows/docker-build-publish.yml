name: Docker Build and Publish

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly: master → latest (1st of month, midnight UTC)
    - cron: '0 0 * * 1'  # Weekly:  development → dev (Monday, midnight UTC)
  workflow_dispatch:
    inputs:
      triggerType:
        description: 'Trigger Type'
        required: true
        type: choice
        options: ['Ad-Hoc Test', 'Scheduled']
      ref:
        description: 'Branch to build (for Ad-Hoc)'
        required: false
        default: 'development'

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read         # Required for reading of Repo content
      packages: write        # Required for package publish
      id-token: write        # Required for Cosign OIDC keyless signing
      security-events: write # Required for Trivy SARIF upload to Security tab

    env:
      IMAGE_NAME: ${{ github.repository }}

    steps:
      # ── Branch resolution ────────────────────────────────────────────────────
      - name: Resolve target branch
        id: branch_select
        run: |
          set -e
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "target_branch=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ]; then
            DOM=$(date -u +%d)
            if [ "$DOM" = "01" ]; then
              echo "target_branch=master" >> "$GITHUB_OUTPUT"
            else
              echo "target_branch=development" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "target_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ steps.branch_select.outputs.target_branch }}

      # ── Docker setup ─────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image signing setup ───────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # ── Tag calculation ───────────────────────────────────────────────────────
      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.branch_select.outputs.target_branch == 'master' }}
            type=raw,value=dev,enable=${{ steps.branch_select.outputs.target_branch == 'development' }}
            type=raw,value={{date 'YYYY-MM-DD'}}-v${{ github.run_number }}

      # ── Build (scan target — single platform, loaded locally for Trivy) ───────
      - name: Build image for scanning
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          platforms: linux/amd64  # local --load only supports single platform
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy scanning ────────────────────────────────────────────────────────
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v6.0.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # Scan 1: JSON format — used as the gate source (stable schema, reliable parsing)
      - name: Scan image — JSON (gate source)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_NO_PROGRESS: "true"
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'       # Gate is enforced separately after all reporting
          ignore-unfixed: true # Only flag vulnerabilities that have a fix available
          vuln-type: os,library
          scanners: vuln

      # Scan 2: SARIF format — uploaded to the GitHub Security tab
      - name: Scan image — SARIF (Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_NO_PROGRESS: "true"
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      # Parse JSON output to count actionable findings
      - name: Count vulnerabilities
        id: check
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' trivy-results.json)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
          else
            echo "result=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          # Category scopes results per branch — prevents merged results
          # when the workflow runs concurrently across branches
          category: trivy-container-${{ steps.branch_select.outputs.target_branch }}

      # Write a clean Markdown summary to the Action run page
      - name: Write job summary
        if: always()
        run: |
          echo "## Trivy container scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ env.IMAGE_NAME }}:scan-target\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | CRITICAL, HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Ignore unfixed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | os, library |" >> $GITHUB_STEP_SUMMARY
          echo "| Findings | ${{ steps.check.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.result }}" = "pass" ]; then
            echo "### ✅ No actionable vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ ${{ steps.check.outputs.count }} actionable vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| CVE | Package | Installed | Fixed | Severity |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              .Results[]? | .Vulnerabilities[]? |
              "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "—") | \(.Severity) |"
            ' trivy-results.json >> $GITHUB_STEP_SUMMARY
          fi

      # Gate: fail the build explicitly after all reporting has completed
      - name: Fail build if vulnerabilities found
        if: steps.check.outputs.result == 'fail'
        run: |
          echo "::error::Trivy found ${{ steps.check.outputs.count }} fixable HIGH/CRITICAL vulnerabilities. Review the Security tab and job summary."
          exit 1

      # ── Build and push (multi-platform) ──────────────────────────────────────
      # Only runs if Trivy gate passes
      - name: Build and push (multi-platform)
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image signing ─────────────────────────────────────────────────────────
      - name: Sign image with Cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"
