name: Reusable - Build, Scan & Publish

on:
  workflow_call:
    inputs:
      ref:
        description: 'Branch to build and publish'
        required: true
        type: string
      tag_channel:
        description: "Floating tag to publish alongside sha/date tags (e.g. 'dev' or 'latest')"
        required: true
        type: string
    outputs:
      digest:
        description: 'Digest of the published multi-arch image'
        value: ${{ jobs.build_and_publish.outputs.digest }}

permissions:
  contents: read

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read          # Reduced from write — the security-findings.md sync now
                              # authenticates as the GitHub App below, not this token
      packages: write         # Required for package publish
      id-token: write         # Required for Cosign OIDC keyless signing
      security-events: write  # Required for Trivy SARIF upload to Security tab

    env:
      IMAGE_NAME: ${{ github.repository }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      # Use a GitHub App installation token for checkout so downstream sync
      # steps can push/PR as the App instead of GITHUB_TOKEN. App-issued tokens
      # are exempt from GitHub's bot PR approval gate. Generate it before
      # checkout and pass it via checkout's `token:` input so checkout persists
      # the App credential directly, instead of relying on fallback overrides.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve GitHub App bot user id (for commit attribution)
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # full history — needed to fetch/worktree the counterpart branch later
          token: ${{ steps.app-token.outputs.token }}  # persisted for the whole job — the sync
                                                        # steps' plain git fetch/push then just work

      # ── Docker setup ─────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image signing setup ───────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # ── Tag calculation ───────────────────────────────────────────────────────
      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.tag_channel }}
            type=raw,value={{date 'YYYY-MM-DD'}}-v${{ github.run_number }}

      # ── Build (scan target — single platform, loaded locally for Trivy) ───────
      - name: Build image for scanning
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          platforms: linux/amd64  # local --load only supports single platform
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy scanning ────────────────────────────────────────────────────────
      # Trivy scans report findings (SARIF + job summary + security-findings.md)
      # The trivy-action handles its own DB caching (default: $GITHUB_WORKSPACE/.cache/trivy).

      # Scan 1: JSON format — used as the reporting source (stable schema, reliable parsing)
      - name: Scan image — JSON (reporting source)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_NO_PROGRESS: "true"
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'       # Informational only — never gates the build
          ignore-unfixed: true # Only flag vulnerabilities that have a fix available
          vuln-type: os,library
          scanners: vuln

      # Scan 2: SARIF format — uploaded to the GitHub Security tab.
      # skip-setup-trivy: true — the Trivy CLI was already installed by the
      - name: Scan image — SARIF (Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_NO_PROGRESS: "true"
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          skip-setup-trivy: true

      # Parse JSON output to count findings (informational — no gating)
      - name: Count vulnerabilities
        id: check
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' trivy-results.json)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          # Category scopes results per branch — prevents merged results
          # when the workflow runs concurrently across branches
          category: trivy-container-${{ inputs.ref }}

      # Write a clean Markdown summary to the Action run page
      - name: Write job summary
        if: always()
        run: |
          echo "## Trivy container scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ env.IMAGE_NAME }}:scan-target\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ inputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | CRITICAL, HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Ignore unfixed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | os, library |" >> $GITHUB_STEP_SUMMARY
          echo "| Findings | ${{ steps.check.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build gated on findings | ❌ No — see security-findings.md |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.count }}" = "0" ]; then
            echo "### ✅ No actionable vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ ${{ steps.check.outputs.count }} actionable vulnerabilities found (non-blocking)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| CVE | Package | Installed | Fixed | Severity |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              .Results[]? | .Vulnerabilities[]? |
              "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "—") | \(.Severity) |"
            ' trivy-results.json >> $GITHUB_STEP_SUMMARY
          fi

      # ── Persist findings to the repo instead of failing the build ────────────
      # security-findings.md holds one section per branch (Development / Production).
      # Each build only ever regenerates its OWN section, then pulls in whatever the
      # other branch's build last wrote and composes the same combined file, which is
      # pushed to BOTH branches. That keeps development and master byte-identical for
      # this file, so promoting development → master never produces a conflict on it.
      - name: Determine section metadata
        id: section
        run: |
          if [ "${{ inputs.ref }}" = "development" ]; then
            echo "name=DEVELOPMENT" >> "$GITHUB_OUTPUT"
            echo "heading=Development branch" >> "$GITHUB_OUTPUT"
            echo "counterpart_branch=master" >> "$GITHUB_OUTPUT"
            echo "counterpart_name=PRODUCTION" >> "$GITHUB_OUTPUT"
            echo "counterpart_heading=Production branch (master)" >> "$GITHUB_OUTPUT"
          else
            echo "name=PRODUCTION" >> "$GITHUB_OUTPUT"
            echo "heading=Production branch (master)" >> "$GITHUB_OUTPUT"
            echo "counterpart_branch=development" >> "$GITHUB_OUTPUT"
            echo "counterpart_name=DEVELOPMENT" >> "$GITHUB_OUTPUT"
            echo "counterpart_heading=Development branch" >> "$GITHUB_OUTPUT"
          fi

      # Fingerprints just the substance of the findings (severity scope, count,
      # and the vulnerability table itself) — deliberately excluding the
      # timestamp/run-id/commit metadata below, which changes on every build
      # regardless of whether the actual findings did. The sync steps further
      # down compare this fingerprint (not the rendered file text) to decide
      # whether there's anything real to sync, so an unchanged scan result
      # no longer produces a new commit/PR on every single build.
      - name: Generate own section
        id: own
        run: |
          FINDINGS_HASH=$(
            {
              echo "${{ steps.check.outputs.count }}"
              if [ "${{ steps.check.outputs.count }}" != "0" ]; then
                jq -r '
                  .Results[]? | .Vulnerabilities[]? |
                  "\(.VulnerabilityID)|\(.PkgName)|\(.InstalledVersion)|\(.FixedVersion // "-")|\(.Severity)"
                ' trivy-results.json | sort
              fi
            } | sha256sum | cut -d' ' -f1
          )
          echo "hash=${FINDINGS_HASH}" >> "$GITHUB_OUTPUT"

          {
            echo "<!-- SECTION:${{ steps.section.outputs.name }}:START -->"
            echo "<!-- FINDINGS-HASH:${{ steps.section.outputs.name }}:${FINDINGS_HASH} -->"
            echo "## ${{ steps.section.outputs.heading }}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ inputs.ref }}\` |"
            echo "| Workflow run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Scanned | $(date -u +'%Y-%m-%d %H:%M UTC') |"
            echo "| Severity scope | CRITICAL, HIGH (fixable only) |"
            echo "| Findings count | ${{ steps.check.outputs.count }} |"
            echo
            if [ "${{ steps.check.outputs.count }}" = "0" ]; then
              echo "✅ No outstanding fixable CRITICAL/HIGH vulnerabilities at time of build."
            else
              echo "| CVE | Package | Installed | Fixed | Severity |"
              echo "|---|---|---|---|---|"
              jq -r '
                .Results[]? | .Vulnerabilities[]? |
                "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "—") | \(.Severity) |"
              ' trivy-results.json
            fi
            echo "<!-- SECTION:${{ steps.section.outputs.name }}:END -->"
          } > /tmp/own-section.md

      - name: Fetch counterpart branch's section
        run: |
          COUNTERPART="${{ steps.section.outputs.counterpart_branch }}"
          COUNTERPART_NAME="${{ steps.section.outputs.counterpart_name }}"
          git fetch origin "$COUNTERPART" 2>/dev/null || true

          FOUND=0
          if git show "origin/$COUNTERPART:security-findings.md" > /tmp/counterpart-full.md 2>/dev/null; then
            if awk "/<!-- SECTION:${COUNTERPART_NAME}:START -->/,/<!-- SECTION:${COUNTERPART_NAME}:END -->/" /tmp/counterpart-full.md > /tmp/counterpart-section.md && [ -s /tmp/counterpart-section.md ]; then
              FOUND=1
            fi
          fi

          if [ "$FOUND" = "0" ]; then
            {
              echo "<!-- SECTION:${COUNTERPART_NAME}:START -->"
              echo "## ${{ steps.section.outputs.counterpart_heading }}"
              echo
              echo "_No scan recorded yet._"
              echo "<!-- SECTION:${COUNTERPART_NAME}:END -->"
            } > /tmp/counterpart-section.md
          fi

      # The original checkout's security-findings.md hasn't been touched yet at
      # this point (Compose, below, is the first thing that overwrites it in
      # this working tree) — so it and the counterpart file just fetched above
      # both still hold whatever fingerprint each branch last recorded for OUR
      # own section. The two sync steps further down use these to skip pushing
      # a commit/PR when the actual findings haven't changed, even though the
      # rendered section text always differs (timestamp/run-id/commit).
      - name: Extract previous findings fingerprints
        id: fingerprints
        run: |
          NAME="${{ steps.section.outputs.name }}"

          OWN_PREV=$(grep -m1 -o "FINDINGS-HASH:${NAME}:[a-f0-9]*" security-findings.md 2>/dev/null | cut -d: -f3 || true)
          echo "own_branch_prev_hash=${OWN_PREV}" >> "$GITHUB_OUTPUT"

          COUNTERPART_PREV=$(grep -m1 -o "FINDINGS-HASH:${NAME}:[a-f0-9]*" /tmp/counterpart-full.md 2>/dev/null | cut -d: -f3 || true)
          echo "counterpart_branch_prev_hash=${COUNTERPART_PREV}" >> "$GITHUB_OUTPUT"

      - name: Compose unified security-findings.md
        run: |
          {
            echo "# Security Findings"
            echo
            echo "_Auto-generated by the Build, Scan & Publish workflow. Do not edit by hand._"
            echo
            echo "This file is kept byte-identical on both \`development\` and \`master\` — each"
            echo "branch's build only ever regenerates its own section below, so promoting"
            echo "\`development\` → \`master\` never produces a merge conflict on this file."
            echo "Findings here do **not** block publishing; each build picks up whatever fixes"
            echo "are available upstream at build time, and anything outstanding is tracked here"
            echo "for a future build to resolve."
            echo
            if [ "${{ steps.section.outputs.name }}" = "DEVELOPMENT" ]; then
              cat /tmp/own-section.md
              echo
              cat /tmp/counterpart-section.md
            else
              cat /tmp/counterpart-section.md
              echo
              cat /tmp/own-section.md
            fi
          } > security-findings.md
          cp security-findings.md /tmp/final-security-findings.md

      - name: Open/refresh PR to sync security-findings.md into own branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}  # for gh CLI calls below
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
        run: |
          set -e
          # Checkout above already persisted the App's credential (via its
          # token: input), so plain git fetch/push authenticate as the App
          # with no further setup — see the note on the checkout step.
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          TARGET="${{ inputs.ref }}"
          BOT_BRANCH="bot/security-findings-sync-${TARGET}"

          # Skip entirely if the actual findings haven't changed since the last
          # build, even though the rendered section (timestamp/run-id/commit)
          # always differs. This is what stops every single build from opening
          # a sync PR regardless of whether anything about the scan changed.
          OWN_PREV_HASH="${{ steps.fingerprints.outputs.own_branch_prev_hash }}"
          NEW_HASH="${{ steps.own.outputs.hash }}"
          if [ -n "$OWN_PREV_HASH" ] && [ "$OWN_PREV_HASH" = "$NEW_HASH" ]; then
            echo "Findings unchanged for $TARGET (hash ${NEW_HASH:0:12}...) — skipping sync PR."
            exit 0
          fi

          git fetch origin "$TARGET"
          git checkout -B "$BOT_BRANCH" "origin/$TARGET"
          cp /tmp/final-security-findings.md security-findings.md

          if git diff --quiet -- security-findings.md; then
            echo "No changes to sync into $TARGET — skipping PR."
            exit 0
          fi

          # NOTE: deliberately no [skip ci] here — pr-validation.yml needs to run
          # on this commit so the PR can satisfy the required build_check status
          # check and be auto-merged.
          git add security-findings.md
          git commit -m "docs(security): update security-findings.md for ${{ github.sha }}"
          git push origin "HEAD:$BOT_BRANCH" --force

          EXISTING_PR=$(gh pr list --base "$TARGET" --head "$BOT_BRANCH" --state open --json number -q '.[0].number' || true)

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base "$TARGET" \
              --head "$BOT_BRANCH" \
              --title "docs(security): sync security-findings.md ($TARGET)" \
              --body "Automated security scan results update. Auto-merges once required checks pass."
          else
            echo "Reusing existing PR #$EXISTING_PR for $BOT_BRANCH."
          fi

          # The merge commit message carries [skip ci] so the push that lands on
          # $TARGET from this merge does NOT re-trigger the build/publish workflow
          # (which only listens for `push`), avoiding a rebuild -> new PR loop.
          #
          # --auto requires the target branch to have at least one branch
          # protection rule for GitHub to queue against (enablePullRequestAutoMerge
          # fails outright otherwise: "Protected branch rules not configured for
          # this branch"). If $TARGET isn't protected, there's nothing to wait for
          # anyway, so fall back to merging immediately.
          MERGE_SUBJECT="docs(security): update security-findings.md for ${{ github.sha }} [skip ci]"
          if ! gh pr merge "$BOT_BRANCH" --squash --auto --subject "$MERGE_SUBJECT" --body "" 2> /tmp/merge-error.txt; then
            if grep -q "Protected branch rules not configured" /tmp/merge-error.txt; then
              echo "No branch protection on $TARGET — merging immediately instead of queuing auto-merge."
              gh pr merge "$BOT_BRANCH" --squash --subject "$MERGE_SUBJECT" --body ""
            else
              cat /tmp/merge-error.txt >&2
              exit 1
            fi
          fi

      - name: Open/refresh PR to sync security-findings.md into counterpart branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}  # for gh CLI calls below
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
        run: |
          set -e
          COUNTERPART="${{ steps.section.outputs.counterpart_branch }}"
          BOT_BRANCH="bot/security-findings-sync-${COUNTERPART}"

          # Same fingerprint short-circuit as the own-branch step above, but
          # compared against what the counterpart branch last recorded for OUR
          # section (the two can be at different points, e.g. right after a
          # first-ever build on one side).
          COUNTERPART_PREV_HASH="${{ steps.fingerprints.outputs.counterpart_branch_prev_hash }}"
          NEW_HASH="${{ steps.own.outputs.hash }}"
          if [ -n "$COUNTERPART_PREV_HASH" ] && [ "$COUNTERPART_PREV_HASH" = "$NEW_HASH" ]; then
            echo "Findings for ${{ steps.section.outputs.name }} unchanged on $COUNTERPART (hash ${NEW_HASH:0:12}...) — skipping sync PR."
            exit 0
          fi

          # As with the own-branch sync step, checkout's persisted App
          # credential covers this too — including the linked worktree
          # below, since actions/checkout's includeIf.gitdir config matches
          # both the main repo path and .git/worktrees/*. No manual header
          # handling needed; plain git commands authenticate as the App.
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch origin "$COUNTERPART"
          git worktree add /tmp/counterpart-checkout "origin/$COUNTERPART"
          cd /tmp/counterpart-checkout
          git checkout -B "$BOT_BRANCH" "origin/$COUNTERPART"
          cp /tmp/final-security-findings.md security-findings.md

          if git diff --quiet -- security-findings.md; then
            echo "Counterpart branch $COUNTERPART already up to date — nothing to sync."
            exit 0
          fi

          # No [skip ci] here either — same reasoning as the own-branch sync: this
          # commit needs pr-validation.yml to run so build_check can pass.
          git add security-findings.md
          git commit -m "docs(security): sync security-findings.md from ${{ inputs.ref }} build"
          git push origin "HEAD:$BOT_BRANCH" --force

          EXISTING_PR=$(gh pr list --base "$COUNTERPART" --head "$BOT_BRANCH" --state open --json number -q '.[0].number' || true)

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base "$COUNTERPART" \
              --head "$BOT_BRANCH" \
              --title "docs(security): sync security-findings.md ($COUNTERPART)" \
              --body "Automated security scan results, synced from the ${{ inputs.ref }} build. Auto-merges once required checks pass."
          else
            echo "Reusing existing PR #$EXISTING_PR for $BOT_BRANCH."
          fi

          # [skip ci] in the merge commit prevents this landing push from
          # re-triggering the counterpart branch's build/publish workflow.
          #
          # Same fallback as the own-branch step above: --auto needs the target
          # branch to have branch protection to queue against, which $COUNTERPART
          # (currently master) doesn't have yet — see "Branch protection on
          # master" in the Open recommendations section of the pipeline docs.
          # Without protection there's nothing to wait for, so merge immediately.
          MERGE_SUBJECT="docs(security): sync security-findings.md from ${{ inputs.ref }} build [skip ci]"
          if ! gh pr merge "$BOT_BRANCH" --squash --auto --subject "$MERGE_SUBJECT" --body "" 2> /tmp/merge-error.txt; then
            if grep -q "Protected branch rules not configured" /tmp/merge-error.txt; then
              echo "No branch protection on $COUNTERPART — merging immediately instead of queuing auto-merge."
              gh pr merge "$BOT_BRANCH" --squash --subject "$MERGE_SUBJECT" --body ""
            else
              cat /tmp/merge-error.txt >&2
              exit 1
            fi
          fi

      # ── Build and push ────────────────────────────────────────────────────────
      # Single platform (linux/amd64) — matches the scan-target build above.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image signing ─────────────────────────────────────────────────────────
      - name: Sign image with Cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"