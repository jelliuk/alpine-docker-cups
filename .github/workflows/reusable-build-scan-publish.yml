name: Reusable - Build, Scan & Publish

on:
  workflow_call:
    inputs:
      ref:
        description: 'Branch to build and publish'
        required: true
        type: string
      tag_channel:
        description: "Floating tag to publish alongside sha/date tags (e.g. 'dev' or 'latest')"
        required: true
        type: string
    outputs:
      digest:
        description: 'Digest of the published multi-arch image'
        value: ${{ jobs.build_and_publish.outputs.digest }}

permissions:
  contents: read

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write         # Required to commit security-findings.md back to the branch
      packages: write         # Required for package publish
      id-token: write         # Required for Cosign OIDC keyless signing
      security-events: write  # Required for Trivy SARIF upload to Security tab

    env:
      IMAGE_NAME: ${{ github.repository }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # full history — needed to fetch/worktree the counterpart branch later

      # ── Docker setup ─────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image signing setup ───────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # ── Tag calculation ───────────────────────────────────────────────────────
      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.tag_channel }}
            type=raw,value={{date 'YYYY-MM-DD'}}-v${{ github.run_number }}

      # ── Build (scan target — single platform, loaded locally for Trivy) ───────
      - name: Build image for scanning
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          platforms: linux/amd64  # local --load only supports single platform
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy scanning ────────────────────────────────────────────────────────
      # NOTE: Findings are reported (SARIF + job summary + security-findings.md)
      # but are never allowed to fail the build. Each new build carries whatever
      # fixes are available upstream at build time; anything still outstanding is
      # documented and picked up by a future build rather than blocking release.
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # Scan 1: JSON format — used as the reporting source (stable schema, reliable parsing)
      - name: Scan image — JSON (reporting source)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_NO_PROGRESS: "true"
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '0'       # Informational only — never gates the build
          ignore-unfixed: true # Only flag vulnerabilities that have a fix available
          vuln-type: os,library
          scanners: vuln

      # Scan 2: SARIF format — uploaded to the GitHub Security tab
      - name: Scan image — SARIF (Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_NO_PROGRESS: "true"
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:scan-target
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      # Parse JSON output to count findings (informational — no gating)
      - name: Count vulnerabilities
        id: check
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' trivy-results.json)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          # Category scopes results per branch — prevents merged results
          # when the workflow runs concurrently across branches
          category: trivy-container-${{ inputs.ref }}

      # Write a clean Markdown summary to the Action run page
      - name: Write job summary
        if: always()
        run: |
          echo "## Trivy container scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ env.IMAGE_NAME }}:scan-target\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ inputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | CRITICAL, HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Ignore unfixed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | os, library |" >> $GITHUB_STEP_SUMMARY
          echo "| Findings | ${{ steps.check.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build gated on findings | ❌ No — see security-findings.md |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.count }}" = "0" ]; then
            echo "### ✅ No actionable vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ ${{ steps.check.outputs.count }} actionable vulnerabilities found (non-blocking)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| CVE | Package | Installed | Fixed | Severity |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              .Results[]? | .Vulnerabilities[]? |
              "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "—") | \(.Severity) |"
            ' trivy-results.json >> $GITHUB_STEP_SUMMARY
          fi

      # ── Persist findings to the repo instead of failing the build ────────────
      # security-findings.md holds one section per branch (Development / Production).
      # Each build only ever regenerates its OWN section, then pulls in whatever the
      # other branch's build last wrote and composes the same combined file, which is
      # pushed to BOTH branches. That keeps development and master byte-identical for
      # this file, so promoting development → master never produces a conflict on it.
      - name: Determine section metadata
        id: section
        run: |
          if [ "${{ inputs.ref }}" = "development" ]; then
            echo "name=DEVELOPMENT" >> "$GITHUB_OUTPUT"
            echo "heading=Development branch" >> "$GITHUB_OUTPUT"
            echo "counterpart_branch=master" >> "$GITHUB_OUTPUT"
            echo "counterpart_name=PRODUCTION" >> "$GITHUB_OUTPUT"
            echo "counterpart_heading=Production branch (master)" >> "$GITHUB_OUTPUT"
          else
            echo "name=PRODUCTION" >> "$GITHUB_OUTPUT"
            echo "heading=Production branch (master)" >> "$GITHUB_OUTPUT"
            echo "counterpart_branch=development" >> "$GITHUB_OUTPUT"
            echo "counterpart_name=DEVELOPMENT" >> "$GITHUB_OUTPUT"
            echo "counterpart_heading=Development branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate own section
        run: |
          {
            echo "<!-- SECTION:${{ steps.section.outputs.name }}:START -->"
            echo "## ${{ steps.section.outputs.heading }}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ inputs.ref }}\` |"
            echo "| Workflow run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Scanned | $(date -u +'%Y-%m-%d %H:%M UTC') |"
            echo "| Severity scope | CRITICAL, HIGH (fixable only) |"
            echo "| Findings count | ${{ steps.check.outputs.count }} |"
            echo
            if [ "${{ steps.check.outputs.count }}" = "0" ]; then
              echo "✅ No outstanding fixable CRITICAL/HIGH vulnerabilities at time of build."
            else
              echo "| CVE | Package | Installed | Fixed | Severity |"
              echo "|---|---|---|---|---|"
              jq -r '
                .Results[]? | .Vulnerabilities[]? |
                "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "—") | \(.Severity) |"
              ' trivy-results.json
            fi
            echo "<!-- SECTION:${{ steps.section.outputs.name }}:END -->"
          } > /tmp/own-section.md

      - name: Fetch counterpart branch's section
        run: |
          COUNTERPART="${{ steps.section.outputs.counterpart_branch }}"
          COUNTERPART_NAME="${{ steps.section.outputs.counterpart_name }}"
          git fetch origin "$COUNTERPART" 2>/dev/null || true

          FOUND=0
          if git show "origin/$COUNTERPART:security-findings.md" > /tmp/counterpart-full.md 2>/dev/null; then
            if awk "/<!-- SECTION:${COUNTERPART_NAME}:START -->/,/<!-- SECTION:${COUNTERPART_NAME}:END -->/" /tmp/counterpart-full.md > /tmp/counterpart-section.md && [ -s /tmp/counterpart-section.md ]; then
              FOUND=1
            fi
          fi

          if [ "$FOUND" = "0" ]; then
            {
              echo "<!-- SECTION:${COUNTERPART_NAME}:START -->"
              echo "## ${{ steps.section.outputs.counterpart_heading }}"
              echo
              echo "_No scan recorded yet._"
              echo "<!-- SECTION:${COUNTERPART_NAME}:END -->"
            } > /tmp/counterpart-section.md
          fi

      - name: Compose unified security-findings.md
        run: |
          {
            echo "# Security Findings"
            echo
            echo "_Auto-generated by the Build, Scan & Publish workflow._"
            echo
            echo "This file is kept byte-identical on both \`development\` and \`master\` — each"
            echo "branch's build only ever regenerates its own section below, so promoting"
            echo "\`development\` → \`master\` never produces a merge conflict on this file."
            echo
            echo "Findings here do **not** block publishing; each build picks up whatever fixes"
            echo "are available upstream at build time, and anything outstanding is tracked here"
            echo "for a future build to resolve and for transparency to the end users."
            echo
            echo "Trivy is a comprehensive, open-source security scanner, and is utilised"
            echo "to provide detailed output below on build status."
            echo
            if [ "${{ steps.section.outputs.name }}" = "DEVELOPMENT" ]; then
              cat /tmp/own-section.md
              echo
              cat /tmp/counterpart-section.md
            else
              cat /tmp/counterpart-section.md
              echo
              cat /tmp/own-section.md
            fi
          } > security-findings.md
          cp security-findings.md /tmp/final-security-findings.md

      - name: Commit & push security-findings.md to own branch (retry-safe)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ inputs.ref }}"
            git reset --hard "origin/${{ inputs.ref }}"
            cp /tmp/final-security-findings.md security-findings.md

            if git diff --quiet -- security-findings.md; then
              echo "No changes to commit on ${{ inputs.ref }} (attempt $attempt)."
              break
            fi

            git add security-findings.md
            git commit -m "docs(security): update security-findings.md for ${{ github.sha }} [skip ci]"

            if git push origin "HEAD:${{ inputs.ref }}"; then
              echo "Pushed to ${{ inputs.ref }} on attempt $attempt."
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push security-findings.md to ${{ inputs.ref }} after 5 attempts."
              exit 1
            fi

            echo "Push to ${{ inputs.ref }} rejected (stale base) — refetching and retrying..."
            sleep $((attempt * 3))
          done

      - name: Sync security-findings.md to counterpart branch (retry-safe)
        run: |
          set -e
          COUNTERPART="${{ steps.section.outputs.counterpart_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$COUNTERPART"
          git worktree add /tmp/counterpart-checkout "origin/$COUNTERPART"
          cd /tmp/counterpart-checkout

          for attempt in 1 2 3 4 5; do
            git fetch origin "$COUNTERPART"
            git reset --hard "origin/$COUNTERPART"
            cp /tmp/final-security-findings.md security-findings.md

            if git diff --quiet -- security-findings.md; then
              echo "Counterpart branch $COUNTERPART already up to date (attempt $attempt) — nothing to sync."
              break
            fi

            git add security-findings.md
            git commit -m "docs(security): sync security-findings.md from ${{ inputs.ref }} build [skip ci]"

            if git push origin "HEAD:$COUNTERPART"; then
              echo "Synced to $COUNTERPART on attempt $attempt."
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to sync security-findings.md to $COUNTERPART after 5 attempts."
              exit 1
            fi

            echo "Push to $COUNTERPART rejected (stale base) — refetching and retrying..."
            sleep $((attempt * 3))
          done

      # ── Build and push (multi-platform) ──────────────────────────────────────
      - name: Build and push (multi-platform)
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image signing ─────────────────────────────────────────────────────────
      - name: Sign image with Cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"
